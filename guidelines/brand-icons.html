<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.l{font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-2)}.m{font:400 11px/1.4 var(--font-sans);color:var(--fg-2);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;gap:30px;align-items:center" id="ic"></div><div class="m" style="margin-top:12px">arrow-left · arrow-right · arrow-up-right · list · menu · maximize · minimize · download · x</div><script>['arrow-left','arrow-right','arrow-up-right','list','menu','maximize','minimize','download','x'].forEach(n=>fetch('https://unpkg.com/lucide-static@0.460.0/icons/'+n+'.svg').then(r=>r.text()).then(t=>{const s=document.createElement('span');s.style.color='var(--fg-1)';s.innerHTML=t.replace('stroke-width="2"','stroke-width="1.25"');document.getElementById('ic').appendChild(s)}))</script></body></html>
