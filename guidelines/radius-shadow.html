<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.l{font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-2)}.m{font:400 11px/1.4 var(--font-sans);color:var(--fg-2);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:end"><div style="display:grid;gap:10px"><div style="height:80px;background:#fff;box-shadow:var(--shadow-book)"></div><div class="m">--shadow-book<br>book</div></div><div style="display:grid;gap:10px"><div style="height:80px;background:#fff;box-shadow:var(--shadow-pop)"></div><div class="m">--shadow-pop<br>popover</div></div><div style="display:grid;gap:10px"><div style="height:80px;border:1px solid var(--line)"></div><div class="m">--hairline<br>1px line</div></div><div style="display:grid;gap:10px"><div style="height:80px;border:1px solid var(--line-strong);border-radius:2px"></div><div class="m">--radius-1 · pill<br>2px · 999px</div></div></div></body></html>
