<!-- @dsCard group="Colors" viewport="700x170" name="Paper & sand" subtitle="Warm off-whites behind the book — never compete with pages" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.l{font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-2)}.m{font:400 11px/1.4 var(--font-sans);color:var(--fg-2);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div style="display:grid;gap:6px"><div style="height:72px;background:var(--paper-0);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Paper 0</div><div class="m">--paper-0<br>#fbfaf7</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--paper-1);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Paper 1</div><div class="m">--paper-1<br>#f5f2ec</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--paper-2);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Paper 2</div><div class="m">--paper-2<br>#efeae0</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--sand-100);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Sand 100</div><div class="m">--sand-100<br>#ebe5d8</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--sand-200);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Sand 200</div><div class="m">--sand-200<br>#ddd4c0</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--sand-300);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Sand 300</div><div class="m">--sand-300<br>#cbc2a2</div></div></div></body></html>
