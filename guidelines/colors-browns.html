<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.l{font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-2)}.m{font:400 11px/1.4 var(--font-sans);color:var(--fg-2);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div style="display:grid;gap:6px"><div style="height:72px;background:var(--taupe-400);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Taupe 400</div><div class="m">--taupe-400<br>#a99a88</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--clay-500);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Clay 500</div><div class="m">--clay-500<br>#806c60</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--brown-600);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Brown 600</div><div class="m">--brown-600<br>#6b5d52</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--brown-700);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Brown 700</div><div class="m">--brown-700<br>#5e4e42</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--brown-800);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Brown 800</div><div class="m">--brown-800<br>#463a31</div></div><div style="display:grid;gap:6px"><div style="height:72px;background:var(--brown-900);border:1px solid var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans)">Brown 900</div><div class="m">--brown-900<br>#2f2823</div></div></div></body></html>
