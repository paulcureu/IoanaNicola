<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & lines" subtitle="Page, hover, press, scrim, hairlines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.l{font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-2)}.m{font:400 11px/1.4 var(--font-sans);color:var(--fg-2);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div style="display:grid;gap:6px"><div style="height:56px;background:var(--surface-page);border:1px solid var(--line)"></div><div class="m">--surface-page</div></div><div style="display:grid;gap:6px"><div style="height:56px;background:var(--surface-raised);border:1px solid var(--line)"></div><div class="m">--surface-raised</div></div><div style="display:grid;gap:6px"><div style="height:56px;background:var(--surface-hover);border:1px solid var(--line)"></div><div class="m">--surface-hover</div></div><div style="display:grid;gap:6px"><div style="height:56px;background:var(--surface-press);border:1px solid var(--line)"></div><div class="m">--surface-press</div></div><div style="display:grid;gap:6px"><div style="height:56px;background:var(--surface-inverse);border:1px solid var(--line)"></div><div class="m">--surface-inverse</div></div><div style="display:grid;gap:6px"><div style="height:56px;background:var(--surface-scrim);border:1px solid var(--line)"></div><div class="m">--surface-scrim</div></div></div><div style="display:flex;gap:28px;margin-top:16px;align-items:center"><div style="flex:1;border-top:1px solid var(--line)"></div><span class="m">--line #e6dfd1</span><div style="flex:1;border-top:1px solid var(--line-strong)"></div><span class="m">--line-strong #cfc4b0</span></div></body></html>
