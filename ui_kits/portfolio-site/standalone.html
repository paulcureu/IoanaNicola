<div id="root"></div>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"layout":"spread","grid":"editorial","motion":true}/*EDITMODE-END*/;
const BASE = window.__resources ? '' : '../../';
if (window.__resources) {
  const R = window.__resources, id = s => s.replace(/-/g, '_');
  SiteUI.img = (b, k) => R['img_' + id(k)];
  window.PORTFOLIO.pages = () => Array.from({ length: 15 }, (_, i) => R['page_' + String(i + 1).padStart(2, '0')]);
  window.PORTFOLIO.pdf = R.pdf;
  const LU = 'https://unpkg.com/lucide-static@0.460.0/icons/', _f = window.fetch.bind(window);
  window.fetch = (u, o) => (typeof u === 'string' && u.startsWith(LU) && R['icon_' + id(u.slice(LU.length).replace('.svg', ''))]) ? _f(R['icon_' + id(u.slice(LU.length).replace('.svg', ''))], o) : _f(u, o);
}

function parseRoute() {
  const legacy = location.hash.match(/^#p=(\d+)/);
  if (legacy) return { name: 'book', page: +legacy[1] };
  const [a, b] = location.hash.replace(/^#\/?/, '').split('/');
  if (a === 'proiecte' || a === 'projects') return b ? { name: 'project', id: b } : { name: 'projects' };
  if (a === 'carte' || a === 'book') return { name: 'book', page: Math.max(1, Math.min(15, +b || 1)) };
  if (a === 'despre' || a === 'about') return { name: 'about' };
  return { name: 'home' };
}

function FadeIn({ children, motion }) {
  const [on, setOn] = React.useState(!motion);
  React.useEffect(() => { if (!motion) return; const r = requestAnimationFrame(() => setOn(true)); return () => cancelAnimationFrame(r); }, []);
  return <div style={{ opacity: on ? 1 : 0, transition: 'opacity 420ms var(--ease-out)' }}>{children}</div>;
}

function App() {
  const DS = window.BudeIoanaNicolaPortofoliuDS_69cab2;
  const P = window.PORTFOLIO;
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = React.useState(parseRoute);
  const [page, setPage] = React.useState(route.page || 1);
  const [lang, setLangState] = React.useState(() => localStorage.getItem('bin-lang') || 'ro');
  const [mobile, setMobile] = React.useState(window.innerWidth < 760);
  const [short, setShort] = React.useState(window.innerHeight < 520);
  const [isFs, setFs] = React.useState(false);
  const c = P.copy[lang];
  const setLang = l => { setLangState(l); localStorage.setItem('bin-lang', l); document.documentElement.lang = l; };

  React.useEffect(() => { document.documentElement.lang = lang; }, []);
  React.useEffect(() => {
    const f = () => { const r = parseRoute(); setRoute(r); if (r.page) setPage(r.page); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', f);
    return () => window.removeEventListener('hashchange', f);
  }, []);
  React.useEffect(() => { const r = () => { setMobile(window.innerWidth < 760); setShort(window.innerHeight < 520); }; window.addEventListener('resize', r); window.addEventListener('orientationchange', r); return () => { window.removeEventListener('resize', r); window.removeEventListener('orientationchange', r); }; }, []);
  React.useEffect(() => { const f = () => setFs(!!document.fullscreenElement); document.addEventListener('fullscreenchange', f); return () => document.removeEventListener('fullscreenchange', f); }, []);
  React.useEffect(() => { if (route.name === 'book') history.replaceState(null, '', '#/carte/' + page); }, [page, route.name]);
  React.useEffect(() => {
    const p = route.name === 'project' ? P.projects.find(x => x.id === route.id) : null;
    const part = { home: '', projects: c.nav.projects, about: c.nav.about, book: c.nav.book }[route.name];
    document.title = [p ? p.title[lang] : part, P.name].filter(Boolean).join(' — ');
  }, [route, lang]);

  const toggleFs = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); };
  const goHome = () => { if (document.fullscreenElement) document.exitFullscreen(); location.hash = '#/'; };
  const common = { lang, mobile, base: BASE, motion: t.motion };

  const links = [
    { label: c.nav.projects, href: '#/proiecte', active: route.name === 'projects' || route.name === 'project' },
    { label: c.nav.book, href: '#/carte/1', active: route.name === 'book' },
    { label: c.nav.about, href: '#/despre', active: route.name === 'about' },
  ];

  let body;
  if (route.name === 'book') {
    body = (mobile || short)
      ? <MobileReader lang={lang} setLang={setLang} page={page} setPage={setPage} onHome={goHome} base={BASE} />
      : <Reader lang={lang} setLang={setLang} page={page} setPage={setPage} onHome={goHome} base={BASE} layout={t.layout} isFs={isFs} toggleFs={toggleFs} />;
  } else {
    const view = {
      home: <HomePage {...common} />,
      projects: <ProjectsPage {...common} grid={t.grid} />,
      project: <ProjectPage key={route.id} id={route.id} {...common} />,
      about: <AboutPage {...common} />,
    }[route.name];
    body = (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--surface-page)' }}>
        <DS.SiteHeader name={P.name} sub={P.short} links={links} lang={lang} onLangChange={setLang} compact={mobile}
          menuLabel={c.nav.menu} closeLabel={c.close}
          menuFooter={<DS.Button variant="text" icon="download" href={BASE + P.pdf} download={P.pdfName}>{c.download}</DS.Button>} />
        <main style={{ flex: 1 }}><FadeIn key={route.name + (route.id || '')} motion={t.motion}>{view}</FadeIn></main>
        {route.name !== 'home' && (
          <DS.SiteFooter name={P.name} note={`${c.faculty}, ${c.city}`} compact={mobile} rights={c.footer.rights}
            links={[...links.map(({ label, href }) => ({ label, href })), { label: c.download, href: BASE + P.pdf, download: P.pdfName }]} />
        )}
      </div>
    );
  }

  return (
    <>
      {body}
      <TweaksPanel>
        <TweakSection label="Projects" />
        <TweakRadio label="Grid" value={t.grid} options={['editorial', 'uniform']} onChange={v => setTweak('grid', v)} />
        <TweakToggle label="Scroll animations" value={t.motion} onChange={v => setTweak('motion', v)} />
        <TweakSection label="Book" />
        <TweakRadio label="Layout" value={t.layout} options={['spread', 'single']} onChange={v => setTweak('layout', v)} />
      </TweaksPanel>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
