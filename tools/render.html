<!doctype html><html><head><style>html,body{margin:0;background:#fff}#out{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}#out img{max-width:100vw;max-height:100vh;display:none}#log{position:fixed;left:0;bottom:0;font:12px monospace;background:#ff0}</style></head><body><div id="out"></div><div id="log">loading</div>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
const L=document.getElementById('log');const t=Date.now();
const doc=await pdfjs.getDocument('../assets/portofoliu-bude-ioana-nicola.pdf').promise;
window.pages=[];
window.show=(p,c,r)=>{const l=document.getElementById('log');if(l)l.remove();const o=document.getElementById('out');o.style.cssText='position:fixed;left:0;top:0;width:924px;height:540px;overflow:hidden;display:block';[...o.children].forEach(i=>i.style.display='none');document.getElementById('p'+p).style.cssText=`display:block;position:absolute;left:${-c*924}px;top:${-r*540}px;width:1848px;height:1307px;max-width:none;max-height:none`;};
for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i);const v0=p.getViewport({scale:1});const v=p.getViewport({scale:2000/v0.width});
const c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
const img=new Image();img.src=c.toDataURL('image/jpeg',0.85);img.id='p'+i;document.getElementById('out').appendChild(img);
window.pages.push([v0.width,v0.height,img.src.length]);L.textContent=i+'/'+doc.numPages+' '+(Date.now()-t)+'ms '+v0.width+'x'+v0.height;}
window.done=true;L.textContent+=' DONE';
</script></body></html>
